<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!--
  Everything that differs per route - title, description, canonical, og:* and
  the JSON-LD graph - is written in at build time by scripts/prerender.mjs from
  src/seo.ts. In `vite dev` the home route's head is injected by the plugin in
  vite.config.ts, so the marker is never visible in a browser.
-->
<!--app-head-->
<!--
  Google Tag Manager (HANDOFF Part 6). One container for the whole domain:
  GTM-5S2Q3XZM already carries GA4 (G-19MWNBHZP0), the Meta pixel bridge,
  scroll-depth and outbound-click tracking, and was already scoped to the
  programme pages. The brand routes simply join it. Do not add a second
  container, and do not install gtag.js directly.

  Gated to the production hostname so localhost, preview builds and the VPS
  staging checkout never push sessions into Apollo's live GA4 property. Remove
  the guard only if you want dev traffic in the reports.
-->
<script>
(function () {
  var live = ['apollonpapas.com', 'www.apollonpapas.com'];
  if (live.indexOf(location.hostname) === -1) return;
  (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':new Date().getTime(),event:'gtm.js'});
  var f=d.getElementsByTagName(s)[0],j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';
  j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-5S2Q3XZM');
})();
</script>
</head>
<body>
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5S2Q3XZM"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
<script src="https://cms.kyroma.dev/overlay/loader.js"></script>
</body>
</html>
